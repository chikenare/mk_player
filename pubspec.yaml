name: mk_player
publish_to: 'none'
description: >
  A highly reusable, self-contained Flutter video player built on
  better_player (ExoPlayer on Android). Supports HLS, DASH, local files,
  HTTP headers, track management, wakelock, and a premium streaming UI.
version: 1.0.0
homepage: https://github.com/yourorg/mk_player

environment:
  sdk: ^3.12.0
  flutter: ">=3.47.0"

dependencies:
  flutter:
    sdk: flutter
  better_player:
    git: https://github.com/chikenare/betterplayer
  wakelock_plus: ^1.7.0
  xml: ^7.0.1
  path_provider: ^2.1.4

dev_dependencies:
  flutter_test:
    sdk: flutter
  flutter_lints: ^6.0.0

flutter:
