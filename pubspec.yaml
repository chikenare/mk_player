name: mk_player
description: >
  A highly reusable, self-contained Flutter video player built on
  better_player_plus (ExoPlayer on Android). Supports HLS, DASH, local files,
  HTTP headers, track management, wakelock, and a premium streaming UI.
version: 1.0.0
homepage: https://github.com/yourorg/mk_player

environment:
  sdk: ^3.11.5
  flutter: ">=3.41.0"

dependencies:
  flutter:
    sdk: flutter
  better_player_plus: 
    git: https://github.com/chikenare/better_player_plus.git
  wakelock_plus: ^1.7.0
  xml: ^7.0.1
  path_provider: ^2.1.4

dev_dependencies:
  flutter_test:
    sdk: flutter
  flutter_lints: ^6.0.0

flutter:
